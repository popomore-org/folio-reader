[workspace]
members = ["crates/folio-core", "crates/folio-bridge", "crates/folio-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Xcode 27's dyld rejects Rust 1.97 proc macros after automatic stripping.
# Keep the host artifacts loadable. Rust issue rust-lang/rust#157750.
[profile.release]
strip = "none"

[profile.dev]
strip = "none"
