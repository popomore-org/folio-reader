name: Release Folio for macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to verify without publication.
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: folio-macos-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release tag and source
        id: source
        env:
          FOLIO_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: scripts/validate-release-source "$FOLIO_TAG" >> "$GITHUB_OUTPUT"
  verification:
    if: github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup toolchain install --no-self-update
      - run: scripts/prepare-update-qa
  release:
    if: github.event_name == 'push' && !github.event.repository.private
    needs: source
    environment: folio-macos-release
    runs-on: xcode-27
    timeout-minutes: 80
    permissions:
      actions: read
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FOLIO_RELEASE_REPOSITORY: ${{ github.repository }}
      FOLIO_TAG: ${{ needs.source.outputs.tag }}
      FOLIO_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Inspect existing release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stage-macos-release inspect >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.release-id != ''
        name: Resume verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.published.outputs.release-id }}
        run: scripts/publish-macos-channel "$FOLIO_VERSION" "$RELEASE_ID" resume
      - if: steps.published.outputs.release-id == ''
        id: signed
        name: Look for signed packages from this run
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DRAFT: ${{ steps.published.outputs.draft }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --method GET -f name=folio-signed-packages)
          count=$(jq -er '.total_count' <<< "$artifacts")
          case "$count" in
            0)
              if [[ "$HAS_DRAFT" == true ]]; then
                echo "::error::The incomplete release has no retained signed packages in this run. Use the original run and its packages."
                exit 1
              fi
              ;;
            1)
              id=$(jq -er '.artifacts[0] | select(.name == "folio-signed-packages" and .expired == false) | .id | select(type == "number")' <<< "$artifacts") || {
                echo "::error::The retained signed packages have expired or cannot be identified."
                exit 1
              }
              printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::More than one signed package artifact matches this run."
              exit 1
              ;;
          esac
      - if: steps.signed.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.signed.outputs.id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: dist
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == ''
        run: rustup toolchain install --no-self-update
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == ''
        name: Import Developer ID and build notarized packages
        env:
          FOLIO_APPLE_CERTIFICATE: ${{ secrets.FOLIO_APPLE_CERTIFICATE }}
          FOLIO_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.FOLIO_APPLE_CERTIFICATE_PASSWORD }}
          FOLIO_APPLE_NOTARY_KEY: ${{ secrets.FOLIO_APPLE_NOTARY_KEY }}
          FOLIO_APPLE_NOTARY_KEY_ID: ${{ secrets.FOLIO_APPLE_NOTARY_KEY_ID }}
          FOLIO_APPLE_NOTARY_ISSUER: ${{ secrets.FOLIO_APPLE_NOTARY_ISSUER }}
          FOLIO_UPDATE_PRIVATE_KEY: ${{ secrets.FOLIO_UPDATE_PRIVATE_KEY }}
          FOLIO_UPDATE_PUBLIC_KEY: ${{ vars.FOLIO_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/folio-signing.XXXXXX")
          previous=$(security list-keychains -d user)
          keychain="$directory/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$directory"
          }
          trap cleanup EXIT
          printf '%s' "$FOLIO_APPLE_CERTIFICATE" | base64 -D > "$directory/certificate.p12"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 - "$keychain" "$previous" <<'PY'
          import shlex, subprocess, sys
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", sys.argv[1], *shlex.split(sys.argv[2])], check=True)
          PY
          security import "$directory/certificate.p12" -f pkcs12 -k "$keychain" -P "$FOLIO_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          export FOLIO_SIGNING_KEYCHAIN="$keychain"
          FOLIO_APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p')
          export FOLIO_APPLE_SIGNING_IDENTITY
          scripts/package-macos-release
      - if: steps.published.outputs.release-id == '' && steps.signed.outputs.id == ''
        name: Retain the exact signed packages before staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-signed-packages
          path: |
            dist/Folio-${{ env.FOLIO_VERSION }}.zip
            dist/Folio-${{ env.FOLIO_VERSION }}.dmg
            dist/appcast.xml
          if-no-files-found: error
          compression-level: 0
      - if: steps.published.outputs.release-id == ''
        name: Stage signed release assets
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/stage-macos-release stage .release/notes.txt \
            "dist/Folio-$FOLIO_VERSION.zip" "dist/Folio-$FOLIO_VERSION.dmg" dist/appcast.xml >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.release-id == ''
        name: Verify remote bytes and promote stable channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage.outputs.release-id }}
        run: scripts/publish-macos-channel "$FOLIO_VERSION" "$RELEASE_ID"
