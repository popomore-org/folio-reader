name: Folio CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    uses: popomore-org/meta/.github/workflows/ci-rust.yml@a3a966614c0ccd31f4b2255808172390266b1d4f
    with:
      runs-on: ubuntu-latest
      execution: serial
      clippy-args: --locked --workspace --all-targets -- -D warnings
      test-command: cargo test --locked --workspace && cargo test --locked -p folio-core --no-default-features
  macos:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and verify application
        run: |
          xcodebuild -version
          rustup show active-toolchain
          node --version
          app="$(scripts/build-macos)"
          info="$app/Contents/Info.plist"
          preview="$app/Contents/PlugIns/FolioQuickLook.appex/Contents/Info.plist"
          test "${app##*/}" = Folio.app
          test "$(plutil -extract CFBundleDisplayName raw "$info")" = Folio
          test "$(plutil -extract CFBundleDisplayName raw "$preview")" = Folio
          test "$(plutil -extract CFBundleIdentifier raw "$preview")" = org.popomore.folio.preview.quicklook
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$preview")" = com.apple.quicklook.preview
          scripts/check-quicklook "$app"
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            apps/macos/Sources/QuickLookRegistry.swift apps/macos/QuickLookTests/RegistrationCheck.swift \
            -o "$RUNNER_TEMP/folio-registration-check"
          "$RUNNER_TEMP/folio-registration-check"
          xcrun swiftc -swift-version 6 -warnings-as-errors -parse-as-library \
            apps/macos/Sources/{PrivateUpdateChannel,LocalUpdateFeed}.swift apps/macos/UpdateTests/PrivateUpdateCheck.swift \
            -o "$RUNNER_TEMP/folio-private-update-check"
          "$RUNNER_TEMP/folio-private-update-check"
          cli="$app/Contents/Helpers/folio"
          "$cli" --help
          test "$("$cli" --version)" = "$(plutil -extract CFBundleShortVersionString raw "$info")"
          status=0
          "$cli" --unknown || status=$?
          test "$status" -eq 2
          status=0
          "$cli" "$app/no-such-file" || status=$?
          test "$status" -eq 1
          status=0
          "$cli" --new-instance --version || status=$?
          test "$status" -eq 2
          cargo test --locked --workspace
          npm test --prefix renderer
          scripts/check-consumer
  gate:
    name: CI gate
    needs: [rust, macos]
    if: ${{ !cancelled() }}
    uses: popomore-org/meta/.github/workflows/ci-gate.yml@a3a966614c0ccd31f4b2255808172390266b1d4f
    with:
      results: ${{ toJSON(needs) }}
      required-success: '["rust","macos"]'
      runs-on: ubuntu-latest
  tag:
    name: Tag macOS Preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: popomore-org/meta/.github/actions/release-tag@a3a966614c0ccd31f4b2255808172390266b1d4f
        with:
          manifest-directory: .release/units
          dry-run: false
          tag-token: ${{ secrets.RELEASE_TAG_TOKEN }}
