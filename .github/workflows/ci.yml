name: Folio CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo test --locked -p folio-core --no-default-features
  macos:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and verify application
        run: |
          xcodebuild -version
          rustup show active-toolchain
          node --version
          app="$(scripts/build-macos)"
          preview="$app/Contents/PlugIns/FolioQuickLook.appex/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$preview")" = org.popomore.folio.preview.quicklook
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$preview")" = com.apple.quicklook.preview
          scripts/check-quicklook "$app"
          cli="$app/Contents/Helpers/folio"
          "$cli" --help
          test "$("$cli" --version)" = "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          status=0
          "$cli" --unknown || status=$?
          test "$status" -eq 2
          status=0
          "$cli" "$app/no-such-file" || status=$?
          test "$status" -eq 1
          status=0
          "$cli" --new-instance --version || status=$?
          test "$status" -eq 2
          cargo test --locked --workspace
          npm test --prefix renderer
          scripts/check-consumer
  gate:
    name: CI gate
    needs: [rust, macos]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-gate.yml
    with:
      rust: ${{ needs.rust.result }}
      macos: ${{ needs.macos.result }}
